<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile POS & Repair Management System</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📱 Mobile POS & Repair System</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded">Offline/Online Ready</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Section 1: Repair Job Card Registration -->
        <section class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">🛠️ Add Repair Job Card</h2>
            <form id="repairForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Customer Name</label>
                    <input type="text" id="custName" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Phone Model</label>
                    <input type="text" id="phoneModel" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Issue / Problem Description</label>
                    <textarea id="issue" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300" rows="2"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Estimated Cost (Rs.)</label>
                    <input type="number" id="cost" required class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-300">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Save Job Card</button>
            </form>
        </section>

        <!-- Section 2: Active Repair Jobs List -->
        <section class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">📋 Active Job Cards</h2>
            <div class="overflow-x-auto max-h-96 overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-sm">
                            <th class="p-2 border">Customer</th>
                            <th class="p-2 border">Model</th>
                            <th class="p-2 border">Issue</th>
                            <th class="p-2 border">Cost</th>
                            <th class="p-2 border">Status</th>
                        </tr>
                    </thead>
                    <tbody id="jobTableBody" class="text-sm text-gray-600">
                        <!-- Dynamic Jobs will load here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript for Handling API -->
    <script>
        const API_URL = 'http://localhost:5000/api';

        // Fetch Jobs on Load
        async function loadJobs() {
            try {
                const response = await fetch(`${API_URL}/jobs`);
                const jobs = await response.json();
                const tbody = document.getElementById('jobTableBody');
                tbody.innerHTML = '';
                
                if(jobs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No job cards found.</td></tr>`;
                    return;
                }

                jobs.forEach(job => {
                    tbody.innerHTML += `
                        <tr class="border-b">
                            <td class="p-2 border">${job.custName}</td>
                            <td class="p-2 border">${job.phoneModel}</td>
                            <td class="p-2 border">${job.issue}</td>
                            <td class="p-2 border">Rs. ${job.cost}</td>
                            <td class="p-2 border text-orange-600 font-semibold">${job.status}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error loading jobs:', err);
            }
        }

        // Handle Job Form Submit
        document.getElementById('repairForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newJob = {
                custName: document.getElementById('custName').value,
                phoneModel: document.getElementById('phoneModel').value,
                issue: document.getElementById('issue').value,
                cost: document.getElementById('cost').value
            };

            try {
                const response = await fetch(`${API_URL}/jobs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newJob)
                });
                const result = await response.json();
                if(result.success) {
                    alert('Job Card Saved Successfully!');
                    document.getElementById('repairForm').reset();
                    loadJobs();
                }
            } catch (err) {
                alert('Error saving job card. Make sure backend is running.');
            }
        });

        // Load jobs when page loads
        loadJobs();
    </script>
</body>
</html>
